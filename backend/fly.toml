# Starting point for `fly launch` / `fly deploy`. Set secrets with:
#   fly secrets set HOMEBASE_JWT_SECRET=... HOMEBASE_DATABASE_URL=... HOMEBASE_GOOGLE_CLIENT_ID=...
app = "homebase-api"
primary_region = "lhr"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"

[[vm]]
  memory = "1gb"
  cpus = 1
