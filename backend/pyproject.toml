[project]
name = "homebase-backend"
version = "0.1.0"
description = "API, data pipeline and ML services for the Homebase bookmark hub"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "google-auth>=2.34",
  "requests>=2.32",
]

[project.optional-dependencies]
# Real semantic embeddings (pulls in PyTorch). Without it the API falls back to a hashing embedder.
embeddings = ["sentence-transformers>=3.0"]
ml = ["umap-learn>=0.5.7", "mlflow>=2.16"]
data = ["pandas>=2.2", "pyarrow>=17", "duckdb>=1.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
