# Local development: PostgreSQL with pgvector plus the API.
#   docker compose up --build        then open http://localhost:8000/docs
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: homebase
      POSTGRES_PASSWORD: homebase
      POSTGRES_DB: homebase
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homebase"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      HOMEBASE_DATABASE_URL: postgresql://homebase:homebase@db:5432/homebase
      HOMEBASE_DEV_AUTH: "true" # local only
      HOMEBASE_JWT_SECRET: ${HOMEBASE_JWT_SECRET:-}
      HOMEBASE_GOOGLE_CLIENT_ID: ${HOMEBASE_GOOGLE_CLIENT_ID:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
